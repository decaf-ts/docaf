name: "Docker Publish"

# Thin caller of decaf-ts/reusable-actions/.github/workflows/docker-publish.yml.
# Publishes this repository's runtime image as ghcr.io/decaf-ts/docaf with the
# package version and the floating `latest` tag. It runs on every GitHub
# Release, in parallel with publish-on-release (npm), and can be dispatched
# manually.
#
# On release the version comes from package.json at the release tag, so the
# image tag matches the npm version. Release builds skip the reusable
# build/test and trivy gates because the release pipeline already ran them;
# manual dispatch defaults to running both before the image build.

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version-tag:
        description: "Explicit version for the versioned tag. Empty = read from package.json."
        required: false
        default: ""
      push:
        description: "Push the built image to the registry (false = build only)."
        type: boolean
        required: false
        default: true
      platforms:
        description: "Platforms to build (buildx format, e.g. linux/amd64,linux/arm64)."
        required: false
        default: "linux/amd64"
      no-cache:
        description: "Build with --no-cache."
        type: boolean
        required: false
        default: false
      registries:
        description: "Comma-separated registries to push to (e.g. 'ghcr.io,docker.io')."
        required: false
        default: "ghcr.io"
      registry-user:
        description: "Username for the registry logins."
        required: false
        default: "decaf-ts-admin"
      run-build-test:
        description: "Run a full build + test before building the image."
        type: boolean
        required: false
        default: true
      run-trivy-scan:
        description: "Run a trivy vulnerability scan (no renovate) before building the image."
        type: boolean
        required: false
        default: true

jobs:
  docker:
    name: Docker image
    uses: decaf-ts/reusable-actions/.github/workflows/docker-publish.yml@master
    with:
      image: decaf-ts/docaf
      dockerfile: Dockerfile
      context: .
      tag-prefix: ""
      floating-tag: latest
      version-tag: ${{ inputs.version-tag }}
      push: ${{ github.event_name != 'workflow_dispatch' || inputs.push != false }}
      platforms: ${{ inputs.platforms || 'linux/amd64' }}
      no-cache: ${{ inputs.no-cache == true }}
      registries: ${{ inputs.registries || 'ghcr.io' }}
      registry-user: ${{ inputs.registry-user || 'decaf-ts-admin' }}
      run-build-test: ${{ inputs.run-build-test == true }}
      run-trivy-scan: ${{ inputs.run-trivy-scan == true }}
    secrets: inherit
